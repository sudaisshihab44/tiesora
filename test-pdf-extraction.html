<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Text Extraction Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #285C43;
      margin-bottom: 20px;
    }
    .upload-area {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      margin-bottom: 30px;
    }
    .upload-area:hover {
      border-color: #285C43;
      background: #f0f8f5;
    }
    .results {
      margin-top: 30px;
    }
    .stat {
      display: inline-block;
      background: #E7F0E8;
      padding: 10px 20px;
      border-radius: 6px;
      margin: 5px;
    }
    .stat strong {
      color: #285C43;
    }
    .page-info {
      margin: 10px 0;
      padding: 15px;
      background: #f9f9f9;
      border-left: 4px solid #285C43;
      border-radius: 4px;
    }
    .page-preview {
      font-family: monospace;
      font-size: 12px;
      background: #fff;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .error {
      background: #ffebee;
      border-left-color: #f44336;
    }
    .success {
      background: #e8f5e9;
      border-left-color: #4caf50;
    }
    #progressBar {
      width: 100%;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
      display: none;
    }
    #progressBar div {
      height: 100%;
      background: #285C43;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 PDF Text Extraction Diagnostic Tool</h1>
    <p>This tool tests PDF text extraction independently from the main application. Upload a PDF to see exactly what text can be extracted from each page.</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <p style="font-size: 18px; margin: 0;">📤 Click to Select PDF File</p>
      <p style="color: #666; margin: 10px 0 0 0;">or drag and drop here</p>
    </div>
    
    <input type="file" id="fileInput" accept="application/pdf" style="display: none;">
    
    <div id="progressBar">
      <div id="progressFill" style="width: 0%"></div>
    </div>
    
    <div id="results" class="results"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('fileInput');
    const resultsDiv = document.getElementById('results');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    fileInput.addEventListener('change', handleFileSelect);

    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file || file.type !== 'application/pdf') {
        showError('Please select a valid PDF file');
        return;
      }

      resultsDiv.innerHTML = '';
      progressBar.style.display = 'block';
      progressFill.style.width = '0%';

      try {
        await extractPDFText(file);
      } catch (error) {
        showError(`Extraction failed: ${error.message}`);
      }
    }

    async function extractPDFText(file) {
      const startTime = Date.now();
      
      // Load PDF
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = pdf.numPages;

      console.log(`PDF loaded: ${totalPages} pages`);
      
      // Show file info
      let html = `<h2>📊 Extraction Results</h2>`;
      html += `<div class="page-info success">`;
      html += `<strong>File:</strong> ${file.name}<br>`;
      html += `<strong>Size:</strong> ${(file.size / 1024).toFixed(2)} KB<br>`;
      html += `<strong>Pages:</strong> ${totalPages}`;
      html += `</div>`;

      const pages = [];
      let totalChars = 0;
      let pagesWithText = 0;
      let pagesScanned = 0;

      // Extract text from each page
      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        progressFill.style.width = `${(pageNum / totalPages) * 100}%`;

        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const text = textContent.items.map(item => item.str).join(' ').trim();

        const hasText = text.length > 50;
        if (hasText) pagesWithText++;
        else pagesScanned++;
        totalChars += text.length;

        pages.push({
          pageNum,
          text,
          hasText,
          charCount: text.length
        });

        console.log(`Page ${pageNum}: ${text.length} chars, hasText: ${hasText}`);
      }

      progressBar.style.display = 'none';

      // Show statistics
      html += `<div style="margin: 20px 0;">`;
      html += `<div class="stat"><strong>Pages with Text:</strong> ${pagesWithText}</div>`;
      html += `<div class="stat"><strong>Scanned Pages:</strong> ${pagesScanned}</div>`;
      html += `<div class="stat"><strong>Total Characters:</strong> ${totalChars.toLocaleString()}</div>`;
      html += `<div class="stat"><strong>Avg Chars/Page:</strong> ${Math.round(totalChars / totalPages)}</div>`;
      html += `<div class="stat"><strong>Processing Time:</strong> ${Date.now() - startTime}ms</div>`;
      html += `</div>`;

      // Show page-by-page breakdown
      html += `<h3>📑 Page-by-Page Breakdown</h3>`;

      pages.forEach(pageData => {
        const status = pageData.hasText ? '✅ TEXT' : '❌ SCANNED';
        const cssClass = pageData.hasText ? 'success' : 'error';
        
        html += `<div class="page-info ${cssClass}">`;
        html += `<strong>Page ${pageData.pageNum}</strong> ${status} - ${pageData.charCount} characters`;
        
        if (pageData.hasText) {
          const preview = pageData.text.substring(0, 300);
          html += `<div class="page-preview">${escapeHtml(preview)}${pageData.text.length > 300 ? '...' : ''}</div>`;
        } else {
          html += `<div class="page-preview" style="color: #999;">No extractable text - requires OCR</div>`;
        }
        
        html += `</div>`;
      });

      // Summary
      html += `<div class="page-info" style="background: #e3f2fd; border-left-color: #2196F3; margin-top: 30px;">`;
      html += `<h3 style="margin-top: 0;">💡 Diagnosis</h3>`;
      
      if (totalChars === 0) {
        html += `<p><strong>Result:</strong> This PDF contains NO extractable text. It is entirely made of scanned images.</p>`;
        html += `<p><strong>Solution:</strong> OCR (Optical Character Recognition) is required to extract text from this document. The AI extraction will use Gemini Vision API for OCR.</p>`;
      } else if (pagesScanned > 0) {
        html += `<p><strong>Result:</strong> Mixed document - ${pagesWithText} pages have text, ${pagesScanned} pages are scanned.</p>`;
        html += `<p><strong>Solution:</strong> Text will be extracted from readable pages. Scanned pages will use OCR via Gemini Vision API.</p>`;
      } else {
        html += `<p><strong>Result:</strong> ✅ All pages contain extractable text! Total: ${totalChars.toLocaleString()} characters.</p>`;
        html += `<p><strong>Solution:</strong> AI can analyze this text directly. Extraction should work smoothly.</p>`;
      }
      
      html += `</div>`;

      resultsDiv.innerHTML = html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showError(message) {
      resultsDiv.innerHTML = `<div class="page-info error"><strong>Error:</strong> ${message}</div>`;
    }

    // Drag and drop support
    const uploadArea = document.querySelector('.upload-area');
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#285C43';
      uploadArea.style.background = '#f0f8f5';
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = '#ccc';
      uploadArea.style.background = '#fafafa';
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#ccc';
      uploadArea.style.background = '#fafafa';
      
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });
  </script>
</body>
</html>
